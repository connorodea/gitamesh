name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes to a PR branch don't queue
# up redundant CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspace packages)
        run: pnpm -r typecheck

      - name: Build (all workspace packages)
        run: pnpm -r build

      - name: Test (all workspace packages)
        run: pnpm -r test

  docker-build:
    name: Docker build (daemon)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only smoke check — confirms apps/daemon/Dockerfile still
      # builds on every push/PR. Does not push anywhere; registry
      # publishing is handled by .github/workflows/release.yml once GHCR
      # credentials/permissions are set up (see that workflow's header
      # comment).
      - name: Build daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/daemon/Dockerfile
          push: false
          tags: gitamesh-daemon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
